dependencies {
    testImplementation project(':xq-karate-support')
    testImplementation 'io.karatelabs:karate-junit6:2.1.2'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperty 'xq.baseUrl', System.getProperty('xq.baseUrl', 'https://httpbin.org')
    systemProperties System.properties.findAll { k, v ->
        k.toString().startsWith('karate.') || k.toString().startsWith('xq.')
    }
    outputs.upToDateWhen { false }
}
